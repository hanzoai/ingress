apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: ingress-lb
spec:
  controller: ingress.k8s.io/ingress-controller
---
apiVersion: ingress.k8s.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: test.route
  namespace: default

spec:
  entryPoints:
    - foo

  ingressClassName: ingress-lb

  routes:
    - match: HostSNI(`foo.com`)
      services:
        - name: whoamitcp
          port: 8000
