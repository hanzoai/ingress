name: Validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

env:
  GOLANGCI_LINT_VERSION: v2.10.1
  MISSPELL_VERSION: v0.7.0
  # Must match ci.yml. Without it every job here fails the checksum-database
  # lookup for github.com/luxfi/zap@v0.8.8, whose tag was force-re-tagged
  # upstream: sum.golang.org holds h1:gFDyzMJ… while the proxy, the origin and
  # our go.sum all serve h1:B3R960O…. The /go.mod hash is identical across both,
  # which is the signature of a source-content re-tag rather than a different
  # module. The transparency log is append-only, so that mismatch is permanent.
  # ci.yml already exempts these namespaces and passes; validate.yaml set no
  # GOPRIVATE at all, so it alone tripped the sumdb check.
  GOPRIVATE: github.com/hanzoai/*,github.com/luxfi/*,github.com/zap-proto/*

jobs:

  lint:
    runs-on: hanzo-build-linux-amd64
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: '.go-version'
          check-latest: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: "${{ env.GOLANGCI_LINT_VERSION }}"

  validate:
    runs-on: hanzo-build-linux-amd64
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: '.go-version'
          check-latest: true

      - name: Install misspell ${{ env.MISSPELL_VERSION }}
        run: curl -sfL https://raw.githubusercontent.com/golangci/misspell/HEAD/install-misspell.sh | sh -s -- -b $(go env GOPATH)/bin ${MISSPELL_VERSION}

      - name: Validate
        run: make validate-files

  validate-generate:
    runs-on: hanzo-build-linux-amd64
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: '.go-version'
          check-latest: true

      - name: go generate
        run: |
          make generate
          git diff --exit-code

      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code

      - name: make generate-crd
        run: |
          make generate-crd
          git diff --exit-code
