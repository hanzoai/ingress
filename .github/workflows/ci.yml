name: CI
on:
  push:
    branches: [main, dev, test]
    tags: ['v*']
  pull_request:
    branches: [main]
permissions:
  contents: read
  packages: write
jobs:
  test:
    runs-on: hanzo-build-linux-amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go mod download
      - run: go test ./...

  docker:
    needs: test
    if: github.event_name != 'pull_request'
    uses: hanzoai/.github/.github/workflows/docker-build.yml@main
    with:
      image: ghcr.io/hanzoai/ingress
      platforms: "linux/amd64"
    secrets: inherit

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: docker
    runs-on: hanzo-deploy-linux-amd64
    environment: production
    steps:
      - name: Rolling restart ingress DaemonSet
        run: |
          kubectl rollout restart daemonset/hanzo-ingress -n hanzo
          kubectl rollout status daemonset/hanzo-ingress -n hanzo --timeout=120s
