name: Build experimental image on branch

on:
  push:
    branches:
      - main
      - v*

permissions:
  contents: read
  packages: write

env:
  CGO_ENABLED: 0

jobs:

  build-webui:
    if: github.repository == 'hanzoai/ingress'
    uses: ./.github/workflows/template-webui.yaml

  experimental:
    if: github.repository == 'hanzoai/ingress'
    needs: build-webui
    name: Build experimental image on branch
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        env:
          ImageOS: ${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.goarm }}
        with:
          go-version-file: '.go-version'
          check-latest: true

      - name: Build
        run: make generate binary

      - name: Branch name
        run: echo ${GITHUB_REF##*/}

      - name: Login to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN is automatically provisioned per workflow run
          # with the `permissions: packages: write` scope above (line
          # 11). It always works against ghcr.io for the same repo's
          # org. The previous GH_PAT secret was either missing or
          # expired, which made every image build silently fail at the
          # login step.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Artifact webui
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: webui.tar.gz

      - name: Untar webui
        run: |
          tar xvf webui.tar.gz
          rm webui.tar.gz

      - name: Build docker image
        env:
          DOCKER_BUILDX_ARGS: "--push --provenance=false --sbom=false"
        run: |
          # Drop the legacy `experimental-` prefix on tags. The
          # workflow only fires on `main` and `v*` branches; pushing
          # `ghcr.io/hanzoai/ingress:<branch>` matches the simpler
          # convention every consumer (KMS, gateway, papers site)
          # already uses.
          make multi-arch-image-${GITHUB_REF##*/}
